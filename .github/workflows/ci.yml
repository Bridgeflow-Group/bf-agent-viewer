# T-018/F-039's prerequisite half, and the first CI pipeline in this repo
# at all: runs the real test suite against every push and pull request, so
# a broken change is caught before it ever reaches a release tag. See
# release.yml for the signed-release workflow this gates by example (that
# workflow re-runs this same test step itself before it builds or signs
# anything) and docs/CLI.md / docs/status.md for what these commands do
# outside of CI.
#
# GitHub-hosted ubuntu-latest runners ship Docker preinstalled and
# reachable, unlike this project's own dev sandbox (see docs/status.md's
# "Blocked" section, T-013) -- so the container-sandbox tests that skip
# locally when no Docker daemon is running should actually execute for
# real here. Nothing special needed to make that happen; noted so a
# passing run here is read as stronger evidence than a local one, not
# assumed equivalent.
#
# The build-images job below is T-013 itself: this dev sandbox's egress
# policy blocks pulling python:3.11-slim from Docker Hub, so `docker
# build` against docker/app/Dockerfile or docker/backend-sandbox/
# Dockerfile has never actually been run to completion anywhere until
# this job does it, on every push/PR, on a runner with real registry
# pull access. Deliberately does NOT push anywhere (no docker/login-
# action, no registry secrets needed) -- that's release.yml's job, gated
# on an actual version tag; this is the cheaper, safe-to-run-on-every-PR
# check that the images build and produce a working entrypoint at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches pyproject.toml's requires-python = ">=3.10".
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with console + dev extras
        run: pip install -e ".[console,dev]"

      - name: Run the test suite
        run: pytest -v

      - name: Report Docker availability
        # Informational only -- doesn't fail the job. Lets a reader of the
        # run log see directly whether the container-sandbox tests above
        # ran for real or fell back to their documented skip path, rather
        # than having to infer it from the test summary alone.
        if: always()
        run: |
          if docker info > /dev/null 2>&1; then
            echo "Docker daemon reachable -- container-sandbox tests ran for real, not skipped."
          else
            echo "Docker daemon NOT reachable on this runner -- container-sandbox tests fell back to their documented skip path."
          fi

  build-check:
    name: Verify the package actually installs from a clean wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Build the wheel from a clean checkout
        # Mirrors tests/test_packaging.py's own from-a-clean-copy build
        # (that test already covers this at the unit level against a
        # temp copy of the tree) -- this step is the same check against
        # what actually gets checked out in CI, on a genuinely clean
        # runner rather than a dev sandbox that might have stray
        # build/*.egg-info left over from local iteration.
        run: python -m build --wheel

      - name: Install the built wheel into a fresh venv and smoke-test it
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/bf-agent-viewer --help
          /tmp/wheel-venv/bin/python -c "
          from bf_agent_viewer.db import reset
          conn = reset('/tmp/ci-smoke.db')
          conn.execute(\"INSERT INTO organizations (id, name) VALUES ('org-1','Org')\")
          conn.commit()
          print('schema.sql/migrations.sql present and a real connect()+insert worked from the installed wheel')
          "

  build-images:
    name: Verify both Docker images actually build (T-013)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the app image (gateway + console)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: false
          load: true
          tags: bf-agent-viewer-app:ci

      - name: Build the backend-sandbox image
        uses: docker/build-push-action@v6
        with:
          context: docker/backend-sandbox
          file: docker/backend-sandbox/Dockerfile
          push: false
          load: true
          tags: bf-agent-viewer-backend-sandbox:ci

      - name: Smoke-test the app image's entrypoint
        # Proves the image doesn't just build but actually runs the
        # installed console script and can talk to a real (mounted)
        # SQLite file -- same "don't just build it, prove it works"
        # standard as the build-check job above, applied to the image
        # instead of the raw wheel.
        run: |
          docker run --rm bf-agent-viewer-app:ci bf-agent-viewer --help
          # The image's non-root user (bfav, uid 10002) owns /data inside
          # the image, but a bind-mounted host directory keeps the host's
          # ownership instead -- open it up so the container user can
          # actually write the database file into it.
          mkdir -p /tmp/ci-image-data
          chmod 777 /tmp/ci-image-data
          docker run --rm -v /tmp/ci-image-data:/data \
            bf-agent-viewer-app:ci bf-agent-viewer org create \
              --db /data/ci-image-smoke.db --id org-1 --name "CI Image Smoke Org"
          test -f /tmp/ci-image-data/ci-image-smoke.db
          echo "App image entrypoint runs and can create a real org against a mounted volume."

      - name: Smoke-test the backend-sandbox image
        # This image has no ENTRYPOINT/CMD of its own (see docker/
        # backend-sandbox/Dockerfile) -- it's the container the gateway
        # launches per-sandboxed-tool-call, not something run directly.
        # Confirm it at least starts and has the expected interpreter
        # and non-root user in place.
        run: |
          docker run --rm bf-agent-viewer-backend-sandbox:ci python3 --version
          docker run --rm bf-agent-viewer-backend-sandbox:ci whoami | grep -qx backend

      - name: Validate docker-compose.yml against the images just built
        run: docker compose config
