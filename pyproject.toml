[project]
name = "bf-agent-viewer"
version = "0.1.0-dev"
description = "Open-source, self-hosted identity and visibility layer for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=4.0.5",
    "mcp>=2.2",
]

[project.optional-dependencies]
# Only needed for `bf-agent-viewer console` -- the gateway/CLI register
# path has no web-framework dependency at all. Deliberately no new
# top-level deps beyond what fastmcp already pulls in transitively
# (confirmed before choosing this stack); pinned here explicitly rather
# than relying silently on that staying true.
console = [
    "starlette>=1.0",
    "jinja2>=3.1",
    "uvicorn>=0.34",
    "pyotp>=2.9",  # F-040: TOTP MFA, mandatory for console login
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
bf-agent-viewer = "bf_agent_viewer.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bf_agent_viewer*"]

[tool.setuptools.package-data]
"bf_agent_viewer.console" = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
