[project]
name = "bf-agent-viewer"
version = "0.1.0-dev"
description = "Open-source, self-hosted identity and visibility layer for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=4.0.5",
    "mcp>=2.2",
    # F-024/T-019: the gateway's OTel-SDK ingestion route
    # (gateway/otel_ingest.py) uses Starlette's Request/JSONResponse
    # directly, the same as FastMCP's own custom_route mechanism it's
    # built on -- already a real transitive dependency of fastmcp (this
    # is exactly what console's own pin, below, already flagged: don't
    # rely silently on a transitive dep staying present). Pinned here in
    # the base install, not just the console extra, since this route is
    # part of the plain `bf-agent-viewer gateway` path, no extras
    # required.
    "starlette>=1.0",
]

[project.optional-dependencies]
# Only needed for `bf-agent-viewer console` -- the gateway/CLI register
# path has no web-framework dependency at all beyond starlette itself
# (now a base dependency, see above). Deliberately no new top-level deps
# beyond what fastmcp already pulls in transitively (confirmed before
# choosing this stack); pinned here explicitly rather than relying
# silently on that staying true.
console = [
    "jinja2>=3.1",
    "uvicorn>=0.34",
    "pyotp>=2.9",  # F-040: TOTP MFA, mandatory for console login
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
bf-agent-viewer = "bf_agent_viewer.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bf_agent_viewer*"]

[tool.setuptools.package-data]
"bf_agent_viewer.console" = ["templates/*.html"]
# schema.sql/migrations.sql are read at runtime by db/connection.py
# (Path(__file__).with_name(...)), not imported as Python -- setuptools
# doesn't package non-.py files by default, so without this an installed
# `pip install .` (this is exactly what docker/app/Dockerfile runs) has
# no schema.sql on disk at all: connect() raises FileNotFoundError on the
# very first command anyone runs against a fresh database. Caught by
# actually installing into a clean venv and running a real command
# against it (T-013) -- not something `pytest` from a source checkout
# would ever catch, since the repo's own schema.sql is always right there
# on disk regardless of what packaging declares.
"bf_agent_viewer.db" = ["*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
