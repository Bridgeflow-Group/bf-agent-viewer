<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}BF Agent Viewer{% endblock %}</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid #2a2d34; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #e6e6e6; text-decoration: none; font-weight: 600; }
  main { padding: 1.5rem; max-width: 1000px; margin: 0 auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #23262d; font-size: 0.9rem; }
  th { color: #9aa0aa; font-weight: 500; text-transform: uppercase; font-size: 0.75rem; }
  a { color: #7db4ff; }
  .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 4px; font-size: 0.75rem; background: #23262d; }
  .badge.blocked, .badge.rate_limited { background: #4a1f1f; color: #ff9d9d; }
  .badge.success { background: #1f3a26; color: #8ee6a5; }
  .muted { color: #8a8f99; }
  form.search input { padding: 0.4rem 0.6rem; border-radius: 4px; border: 1px solid #33363f; background: #1a1c22; color: #e6e6e6; width: 240px; }
  form.search button { padding: 0.4rem 0.8rem; border-radius: 4px; border: none; background: #2b6cb0; color: white; cursor: pointer; }
  .empty { color: #8a8f99; padding: 2rem 0; }
  code, pre { background: #1a1c22; border-radius: 4px; padding: 0.15rem 0.4rem; font-size: 0.85rem; }
  pre { padding: 0.75rem; overflow-x: auto; }
</style>
</head>
<body>
<header>
  <a href="/">BF Agent Viewer</a>
  <form class="search" action="/search" method="get">
    <input type="text" name="q" placeholder="Search agents, events, tools..." value="{{ q or '' }}">
    <button type="submit">Search</button>
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
